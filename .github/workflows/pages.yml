name: Deploy privacy page to GitHub Pages

# Publishes page/dataprivacy/public.md as a static HTML page on GitHub Pages.
# Prerequisite: in the repo settings, set Pages → Source to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render markdown to HTML
        run: |
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update && sudo apt-get install -y pandoc
          fi
          mkdir -p site
          pandoc page/dataprivacy/public.md \
            --from gfm --to html5 --standalone \
            --metadata title="Tab Sweeper — Data Privacy" \
            -o site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
